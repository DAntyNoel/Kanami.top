name: kanami-cliproxy-usage

services:
  cpa-usage-keeper:
    image: ${CPA_USAGE_KEEPER_IMAGE:-ghcr.io/willxup/cpa-usage-keeper@sha256:bb93afd2f9ad24577529c7a0153181d148d1e62898fbdbe3e10971a34571a2a1}
    container_name: kanami-cpa-usage-keeper
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CPA_BASE_URL: http://kanami-cliproxy-api:8317
      CPA_MANAGEMENT_KEY: ${MANAGEMENT_PASSWORD:?Set MANAGEMENT_PASSWORD in cliproxy/.env}
      REDIS_QUEUE_ADDR: kanami-cliproxy-api:8317
      AUTH_ENABLED: ${USAGE_KEEPER_AUTH_ENABLED:-true}
      LOGIN_PASSWORD: ${USAGE_KEEPER_PASSWORD:-${MANAGEMENT_PASSWORD:?Set MANAGEMENT_PASSWORD in cliproxy/.env}}
      APP_PORT: 8080
      APP_BASE_PATH: ${USAGE_KEEPER_BASE_PATH:-}
      WORK_DIR: /data
      LOG_LEVEL: ${USAGE_KEEPER_LOG_LEVEL:-info}
      LOG_FILE_ENABLED: ${USAGE_KEEPER_LOG_FILE_ENABLED:-true}
      BACKUP_ENABLED: ${USAGE_KEEPER_BACKUP_ENABLED:-true}
      BACKUP_RETENTION_DAYS: ${USAGE_KEEPER_BACKUP_RETENTION_DAYS:-14}
    ports:
      - "127.0.0.1:${USAGE_KEEPER_PORT:-12704}:8080"
    volumes:
      # SQLite WAL/SHM must stay on Docker's Linux filesystem. Windows bind
      # mounts can leave an unrecoverable wal-index after an abrupt restart.
      - keeper-data:/data
    networks:
      - cliproxy

  keeper-cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    container_name: kanami-cpa-usage-keeper-cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - run
      - --token
      - ${KEEPER_TUNNEL_TOKEN:-}
    depends_on:
      - cpa-usage-keeper
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cliproxy
    profiles:
      - keeper-tunnel
    restart: unless-stopped

networks:
  cliproxy:
    name: kanami-cliproxy_default
    external: true

volumes:
  keeper-data:
    external: true
    name: kanami-cpa-usage-keeper-data
