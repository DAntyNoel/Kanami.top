<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanami Sweeper</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../shared/game-header.css" />
  <link rel="icon" type="image/png" href="../../res/images/favicon.png" />
</head>
<body>
  <header class="game-header" aria-label="小游戏页眉">
    <a href="../../index.html" class="game-logo" aria-label="返回 kanami.top">
      <img src="../../res/images/favicon.png" alt="" />
      <span>kanami.top</span>
    </a>
    <div class="game-header-copy">
      <p class="game-kicker">KANAMI GAME</p>
      <h1>Kanami Sweeper</h1>
      <p>舞台上藏着星光炸点。安全揭开格子，给危险位置插上旗，香奈美就能顺利开演。</p>
    </div>
    <section class="game-header-stats" aria-label="游戏状态">
      <div class="game-stat"><span>旗帜</span><strong id="flags">10</strong></div>
      <div class="game-stat"><span>时间</span><strong id="timer">0</strong></div>
      <div class="game-stat"><span>最佳</span><strong id="best">--</strong></div>
    </section>
    <nav class="game-header-actions" aria-label="页面导航">
      <a href="CREDITS.md">致谢</a>
    </nav>
  </header>

  <main class="game-shell">
    <section class="panel hud game-action-bar" aria-label="游戏操作">
      <button id="mode" type="button" aria-pressed="false">翻开</button>
      <button id="restart" type="button">重开</button>
    </section>

    <section class="board" id="board" aria-label="Kanami sweeper board"></section>
    <section class="panel message" id="message" aria-live="polite">第一格一定安全；手机上可以切换旗帜模式，或长按格子插旗。</section>
  </main>

  <script src="../shared/leave-confirm.js"></script>
  <script src="config.js"></script>
  <script src="game.js"></script>
  <script src="../../res/scripts/header.js"></script>
</body>
</html>
