<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch Kanami</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../shared/game-header.css" />
  <link rel="icon" type="image/png" href="../../res/images/favicon.png" />
</head>
<body>
  <header class="game-header" aria-label="小游戏页眉">
    <a href="../../index.html" class="game-logo" aria-label="返回 kanami.top">
      <img src="../../res/images/favicon.png" alt="" />
      <span>kanami.top</span>
    </a>
    <div class="game-header-copy">
      <p class="game-kicker">KANAMI GAME</p>
      <h1>Catch Kanami</h1>
      <p>舞台灯亮起的时候，点中香奈美的位置。看到干扰光可要忍住，香奈美正在考验你的反应哦。</p>
    </div>
    <section class="game-header-stats" aria-label="游戏状态">
      <div class="game-stat"><span>分数</span><strong id="score">0</strong></div>
      <div class="game-stat"><span>时间</span><strong id="time">30</strong></div>
      <div class="game-stat"><span>最佳</span><strong id="best">0</strong></div>
    </section>
    <nav class="game-header-actions" aria-label="页面导航">
      <a href="CREDITS.md">致谢</a>
    </nav>
  </header>

  <main class="game-shell">
    <section class="panel hud game-action-bar" aria-label="游戏操作">
      <button id="start" type="button">开始</button>
    </section>

    <section class="stage" id="stage" aria-label="Catch Kanami board"></section>
    <section class="panel message" id="message" aria-live="polite">准备好了就点开始，香奈美会在灯光里闪现。</section>
  </main>

  <script src="../shared/leave-confirm.js"></script>
  <script src="config.js"></script>
  <script src="game.js"></script>
  <script src="../../res/scripts/header.js"></script>
</body>
</html>
