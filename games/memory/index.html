<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanami Memory</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="../../res/images/favicon.png" />
</head>
<body>
  <main class="game-shell">
    <nav class="topbar" aria-label="Game navigation">
      <a href="../../index.html">返回 Kanami.top</a>
      <a href="CREDITS.md">致谢</a>
    </nav>

    <section class="hero">
      <p class="eyebrow">KANAMI GAME</p>
      <h1>Kanami Memory</h1>
      <p>翻开香奈美准备的卡片吧。记住表情包的位置，全部配对成功就算我赢啦。</p>
    </section>

    <section class="panel stats" aria-label="Game stats">
      <div>
        <span>步数</span>
        <strong id="moves">0</strong>
      </div>
      <div>
        <span>时间</span>
        <strong id="timer">00:00</strong>
      </div>
      <div>
        <span>最佳</span>
        <strong id="best">--</strong>
      </div>
      <button id="restart" type="button">重开</button>
    </section>

    <section class="board" id="board" aria-label="Kanami memory board"></section>

    <section class="panel message" id="message" aria-live="polite">
      香奈美已经洗好牌啦，第一张由你来翻。
    </section>
  </main>

  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
