<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanami Memory</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../shared/game-header.css" />
  <link rel="icon" type="image/png" href="../../res/images/favicon.png" />
</head>
<body>
  <header class="game-header" aria-label="小游戏页眉">
    <a href="../../index.html" class="game-logo" aria-label="返回 kanami.top">
      <img src="../../res/images/favicon.png" alt="" />
      <span>kanami.top</span>
    </a>
    <div class="game-header-copy">
      <p class="game-kicker">KANAMI GAME</p>
      <h1>Kanami Memory</h1>
      <p>翻开香奈美准备的卡片吧。记住表情包的位置，全部配对成功就算我赢啦。</p>
    </div>
    <section class="game-header-stats" aria-label="游戏状态">
      <div class="game-stat">
        <span>步数</span>
        <strong id="moves">0</strong>
      </div>
      <div class="game-stat">
        <span>时间</span>
        <strong id="timer">00:00</strong>
      </div>
      <div class="game-stat">
        <span>最佳</span>
        <strong id="best">--</strong>
      </div>
    </section>
    <nav class="game-header-actions" aria-label="页面导航">
      <a href="CREDITS.md">致谢</a>
    </nav>
  </header>

  <main class="game-shell">
    <section class="panel stats game-action-bar" aria-label="游戏操作">
      <button id="restart" type="button">重开</button>
    </section>

    <section class="board" id="board" aria-label="Kanami memory board"></section>

    <section class="panel message" id="message" aria-live="polite">
      香奈美已经洗好牌啦，第一张由你来翻。
    </section>
  </main>

  <script src="../shared/leave-confirm.js"></script>
  <script src="config.js"></script>
  <script src="game.js"></script>
  <script src="../../res/scripts/header.js"></script>
</body>
</html>
