<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香奈美本地舞台 - 服务离线</title>
  <link rel="stylesheet" href="res/styles/style.css" />
  <link rel="stylesheet" href="res/styles/layers.css" />
  <link rel="stylesheet" href="res/styles/stamp.css" />
  <link rel="icon" type="image/png" href="res/images/favicon.png" />
</head>
<body>
  <div class="background" style="background-image: url('res/images/backgrounds/Soda.png');"></div>

  <header class="site-header" data-site-header="local-server">
    <a href="/" class="site-logo" aria-label="回到本地服务主目录">
      <img src="res/images/favicon.png" alt="香奈美本地舞台 logo" />
      <span class="site-logo-text">本地舞台</span>
    </a>
    <div class="site-header-copy" aria-label="当前页面">
      <h1>香奈美的本地舞台</h1>
    </div>
    <nav class="site-nav" aria-label="服务入口">
      <a href="/auth/login" class="site-nav-link" data-auth-entry data-auth-login-url="/auth/login" data-auth-profile-url="/auth/profile">
        <img src="res/images/favicon.png" alt="" class="site-user-avatar" data-auth-avatar hidden />
        <span class="site-profile-label" data-auth-label>登录</span>
      </a>
      <a href="https://kanami.top/" class="site-nav-link site-nav-link-primary">线上主站</a>
      <a href="/__reload?next=/offline" class="site-nav-link site-nav-link-reload">刷新缓存</a>
    </nav>
  </header>

  <main class="main-content">
    <section class="section welcome">
      <h1>香奈美的本地舞台暂时离线</h1>
      <p><span class="highlight">香奈美还没有接上本地 12700 端口。</span></p>
      <p>请确认本地服务和 Cloudflare Tunnel 已经启动，稍等一下再刷新就好。</p>
      <a href="/" class="btn">回到入口</a>
    </section>
  </main>
  <script src="script.js"></script>
  <script src="res/scripts/header.js"></script>
  <script src="/auth/session.js"></script>
  <script src="/__reload-client.js"></script>
</body>
</html>
