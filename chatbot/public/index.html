<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>来和我聊天｜香奈美</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/res/images/favicon.png" />
</head>
<body>
  <header class="kanami-chat-site-header" aria-label="站点页眉">
    <a href="https://kanami.top/" class="kanami-header-logo" aria-label="回到 kanami.top 主站">
      <img src="/res/images/favicon.png" alt="" />
      <span>kanami.top</span>
    </a>
    <div class="kanami-header-copy" aria-label="当前页面">
      <h1>来和我聊天</h1>
    </div>
    <nav class="kanami-header-actions" aria-label="快捷入口">
      <a href="https://kanami.top/resource/">星光收藏室</a>
      <a href="https://kanami.top/#games">小游戏</a>
      <a href="https://kanami.top/">主站</a>
    </nav>
  </header>

  <main class="chat-shell">
    <section class="profile" aria-label="香奈美">
      <div class="profile-art">
        <img src="/res/images/lovekanami.jpg" alt="香奈美" />
      </div>
      <div class="profile-copy">
        <p class="eyebrow">我在这里听你说话</p>
        <h1>我在这里。</h1>
        <p>今天也想听听引航者的声音。把想说的话交给我吧，我会认真接住。</p>
      </div>
    </section>

    <section class="chat-panel" aria-label="聊天窗口">
      <header class="chat-header">
        <div>
          <strong>香奈美</strong>
          <span id="status">正在连接后台</span>
        </div>
        <button class="icon-button" id="clear-chat" type="button" title="清空对话" aria-label="清空对话">↺</button>
      </header>

      <div class="messages" id="messages" aria-live="polite"></div>

      <form class="composer" id="composer">
        <textarea id="message-input" name="message" rows="1" maxlength="2400" placeholder="引航者，想和我说什么？"></textarea>
        <button id="send-button" type="submit">发送</button>
      </form>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
  <script src="/res/scripts/header.js"></script>
</body>
</html>
